version: '3.8'

services:
  mplad-ai-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mplad_ai_intelligence
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
